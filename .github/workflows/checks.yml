name: CRM LOOP checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node verify-worker.mjs
      # 원문 데이터는 내려받지 않습니다. 결과 파일과 문서의 일치, 계산식만 검사하고
      # 원문이 필요한 재계산 검사는 건너뜁니다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -r analysis/requirements.txt
      - run: python -m pytest analysis/tests
